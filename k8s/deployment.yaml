
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-eks-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-eks-app
  template:
    metadata:
      labels:
        app: devops-eks-app
    spec:
      containers:
        - name: devops-eks-app
          image: devops-eks-app:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
