
name: DevOps CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest app/tests/ -v

      - name: Build Docker image
        run: docker build -t devops-eks-app:${{ github.sha }} ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-eks-app:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::594729247345:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-eks-app:${{ github.sha }} \
            594729247345.dkr.ecr.us-east-1.amazonaws.com/devops-eks-app:${{ github.sha }}
          docker tag devops-eks-app:${{ github.sha }} \
            594729247345.dkr.ecr.us-east-1.amazonaws.com/devops-eks-app:latest

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push 594729247345.dkr.ecr.us-east-1.amazonaws.com/devops-eks-app:${{ github.sha }}
          docker push 594729247345.dkr.ecr.us-east-1.amazonaws.com/devops-eks-app:latest
